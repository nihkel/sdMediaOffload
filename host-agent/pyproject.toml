[project]
name = "sdoffload-agent"
version = "0.1.0"
description = "Host-side udev agent for SD Media Offload (runs on Proxmox host)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
sdoffload-agent = "sdoffload_agent.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdoffload_agent"]
