# Dev override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# - Backend gets bind-mounted source + uvicorn --reload
# - Frontend runs in its own container with vite dev server (hot reload)
# - Vite proxies /api to the backend container at app:8000
services:
  app:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    user: "0:0"            # so reload can write .pyc; safe for dev only
    volumes:
      - ./backend:/app
      - ${SDOFFLOAD_DATA_PATH:-./data}:/app/data
      - ${SDOFFLOAD_DESTINATION_PATH:-./media}:/data/media
      - ${SDOFFLOAD_SOURCE_PATH:-./mock-source}:/mnt/sdoffload:ro
    environment:
      SDOFFLOAD_LOG_LEVEL: DEBUG

  frontend:
    image: node:22-alpine
    container_name: sdoffload-frontend
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      BACKEND_URL: http://app:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  frontend_node_modules:
